# =============================================================================
# The local development stack: PostgreSQL + WildFly
# =============================================================================
#   docker compose up -d --build     start everything
#   docker compose logs -f wildfly   watch the application log
#   docker compose down              stop (keeps the database volume)
#   docker compose down -v           stop and DELETE the database
#
# NOTE ON PORTS: this machine already runs other projects on 8080, 5432 and
# 55432, so the HOST ports here are 8280 (application) and 55433 (database).
# The application is at http://localhost:8280/enrollment
# The mail inbox (Mailpit)  is at http://localhost:8225 - every message the
# application sends lands there and goes no further.
#
# The development loop once this is running:
#   mvn package   ->  the WAR lands in ./docker/deployments
#                 ->  WildFly's deployment scanner notices and hot-redeploys
#   No container restart, no manual copying.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL - the database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: enrollment-postgres

    environment:
      # These three variables are the official image's initialisation contract:
      # on FIRST start with an empty data directory it creates this database and
      # this user. If the volume already has data they are ignored - which is
      # why changing the password here has no effect until you `down -v`.
      POSTGRES_DB: enrollment
      POSTGRES_USER: enrollment
      POSTGRES_PASSWORD: enrollment
      # Speeds up initdb slightly and keeps collation deterministic.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"

    ports:
      # host:container.
      #
      # The HOST side is 55433 rather than the usual 5432 because you already
      # have other projects listening on 5432 and 55432. Only the host side
      # matters here - inside the Docker network WildFly still reaches this
      # container as `postgres:5432`, which is what configure.cli uses. Changing
      # a host port never requires changing application configuration, and that
      # separation is the whole point of container networking.
      #
      # Exposed at all so you can connect a GUI client (DBeaver, pgAdmin,
      # IntelliJ's database tool) and actually LOOK at the tables Hibernate
      # generates - the fastest way to understand a mapping.
      - "55433:5432"

    volumes:
      # A NAMED VOLUME, managed by Docker. Without it the database lives inside
      # the container's writable layer and every `docker compose down` silently
      # destroys your data.
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      # A container being "started" is not the same as the service inside it
      # being READY. PostgreSQL takes a few seconds to initialise, and WildFly
      # would otherwise try to fill its connection pool against a database that
      # is not listening yet, and fail the deployment.
      #
      # pg_isready is Postgres's own readiness probe.
      test: ["CMD-SHELL", "pg_isready -U enrollment -d enrollment"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WildFly - the Jakarta EE application server
  # ---------------------------------------------------------------------------
  wildfly:
    build:
      context: ./docker/wildfly
      dockerfile: Dockerfile
    container_name: enrollment-wildfly

    ports:
      # Host port 8280, because 8080 on this machine is already taken by another
      # project. The container still serves on 8080 internally.
      - "8280:8080"   # the application:   http://localhost:8280/enrollment
      - "9990:9990"   # the admin console: http://localhost:9990  (admin / Admin#2026)

    volumes:
      # THE HOT-DEPLOY MOUNT.
      #
      # WildFly's deployment scanner watches this directory. Because Maven is
      # configured (see <outputDirectory> in pom.xml) to write the WAR straight
      # here, `mvn package` triggers a redeploy within a second or two.
      #
      # The scanner also writes marker files next to the WAR - enrollment.war.deployed
      # on success, .failed with the reason on error. Those appear on your host,
      # which is why .gitignore excludes them. Reading the .failed file is the
      # quickest way to diagnose a deployment that did not come up.
      - ./docker/deployments:/opt/jboss/wildfly/standalone/deployments

    environment:
      # Heap sizing. The default is a fraction of host RAM, which in a container
      # can be surprisingly large. Being explicit keeps the footprint predictable.
      JAVA_OPTS: >-
        -Xms256m
        -Xmx768m
        -Djava.net.preferIPv4Stack=true
        -Djboss.as.management.blocking.timeout=600

      # ---------------------------------------------------------------------
      # MAIL
      # ---------------------------------------------------------------------
      # Read by MailConfig, which looks for a system property first and then an
      # environment variable - so every one of these can be overridden for a
      # single run with -Denrollment.mail.xxx without editing this file.
      #
      # transport=smtp rather than the `auto` default, deliberately: the mail
      # session is baked into this image by configure.cli, so if it is missing
      # something is wrong with the build and the deployment SHOULD fail loudly
      # rather than quietly degrade to writing emails into the log. `auto` is
      # the right default for a laptop running WildFly natively, where there may
      # genuinely be no mail server; it is the wrong one here.
      ENROLLMENT_MAIL_TRANSPORT: smtp
      ENROLLMENT_MAIL_FROM: no-reply@enrollment.unicam.test
      ENROLLMENT_MAIL_FROM_NAME: UNICAM Enrollment

      # Every subject is marked, so a message from this stack can never be
      # mistaken for one from a real registrar.
      ENROLLMENT_MAIL_SUBJECT_PREFIX: "[DEV]"

      # Where links inside outgoing mail point - the password reset link, for
      # now. Set explicitly rather than taken from the request, because the
      # request's Host header is chosen by whoever sent it: a reset link built
      # from that header can be pointed at an attacker's server by anybody who
      # can reach the form. HOST HEADER INJECTION, and password reset is where
      # it is nearly always found. Leave it unset and the application falls
      # back to the request with a warning at startup, which is fine on a
      # laptop and is not a production default.
      ENROLLMENT_MAIL_PUBLIC_BASE_URL: http://localhost:8280/enrollment

      # Worth knowing about even though it is commented out. It forces EVERY
      # message to one address regardless of its recipient - the standard
      # protection for a staging environment restored from a production
      # database, where the addresses in the data belong to real people.
      # ENROLLMENT_MAIL_REDIRECT_TO: you@example.com

    depends_on:
      postgres:
        # Waits for the HEALTHCHECK above to pass, not merely for the container
        # to exist. `depends_on` without a condition only orders startup, which
        # is almost never what you actually want.
        condition: service_healthy
      mailpit:
        # No health condition: unlike the database, a missing mail server does
        # not stop the application from starting. Messages stay in the outbox
        # and the dispatcher retries them, which is the entire point of having
        # an outbox. Ordering alone is enough here.
        condition: service_started

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mailpit - a fake SMTP server with a web inbox
  # ---------------------------------------------------------------------------
  # It accepts every message, delivers none of them, and shows them all at
  # http://localhost:8225 - so you can watch a real SMTP conversation happen and
  # read the result, without a single email reaching a real person.
  #
  # This is the standard way to develop against mail, and it is worth insisting
  # on: the alternative is either a transport that only pretends (which hides
  # every encoding, header and address bug until production) or a real relay
  # (which sooner or later mails an actual student from someone's laptop).
  # Mailpit is the same shape as MailHog, which you will meet in older projects.
  mailpit:
    image: axllent/mailpit:v1.21

    container_name: enrollment-mailpit

    ports:
      # Shifted off the defaults (8025 / 1025) for the same reason as 8280 and
      # 55433 above: this machine runs other projects. Only the HOST side moves -
      # inside the Docker network WildFly still reaches `mailpit:1025`, which is
      # what configure.cli refers to.
      - "8225:8025"   # the web inbox: http://localhost:8225
      - "1225:1025"   # SMTP, exposed only so you can point another tool at it

    environment:
      # A development server: accept any credentials, and do not insist on TLS.
      # Both of these would be indefensible on anything reachable from outside
      # this machine, which is exactly why they are written down here rather
      # than being defaults nobody notices.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Keep the inbox from growing without bound across weeks of use.
      MP_MAX_MESSAGES: "500"

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MongoDB - the document store, used as a READ MODEL beside PostgreSQL
  # ---------------------------------------------------------------------------
  # Not a replacement for PostgreSQL and not a second system of record. The
  # Spring service projects course documents into it (see CourseProjectionService)
  # and nothing else ever writes to it, so it can be dropped and rebuilt at any
  # time.
  #
  # OPT-IN. The Spring service excludes the MongoDB auto-configuration unless the
  # `mongo` profile is active, so this container is only useful with:
  #
  #     mvn spring-boot:run -f spring-service/pom.xml   #         -Dspring-boot.run.profiles=demo,mongo
  #
  # That default is deliberate: a read model being unavailable must not stop the
  # application taking enrollments.
  mongo:
    image: mongo:7.0
    container_name: enrollment-mongo

    ports:
      # 27117 on the host rather than the default 27017, for the same reason
      # PostgreSQL is on 55433 and the application on 8280 - this machine runs
      # other projects. Inside the compose network it is still `mongo:27017`.
      - "27117:27017"

    environment:
      MONGO_INITDB_DATABASE: enrollment

    volumes:
      # A named volume, for the same reason as postgres-data: without it the
      # data lives in the container writable layer and every `down` destroys it.
      #
      # Less critical here than for PostgreSQL, and that difference is the whole
      # point of a read model: losing this volume costs one rebuild, whereas
      # losing postgres-data costs the data.
      - mongo-data:/data/db

    healthcheck:
      # The MongoDB shell is `mongosh` in 6.0+; older material says `mongo`,
      # which does not exist in this image.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  mongo-data:
    driver: local
