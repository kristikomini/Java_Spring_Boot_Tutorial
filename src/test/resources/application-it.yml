# ===========================================================================
# INTEGRATION TEST PROFILE
# ===========================================================================
# Used by EnrollmentApiIT only. The datasource is NOT configured here: the
# Testcontainers @ServiceConnection supplies the URL, username and password at
# runtime, because the container port is random and cannot be written down in
# advance.
#
# The two settings below are the whole point of this file, and together they are
# what makes the integration test prove something the other tests cannot.
# ===========================================================================

spring:
  # The integration tests exercise the REST API over a real PostgreSQL. MongoDB
  # has no part in that, but the embedded flapdoodle mongod is on the test
  # classpath, so Boot auto-configures it for every @SpringBootTest and then
  # fails with "Set the de.flapdoodle.mongodb.embedded.version property".
  #
  # The `test` profile excludes the same four entries for the same reason. This
  # profile needed its own copy because profile-specific properties REPLACE a
  # base list rather than merging with it - there is no inheritance between two
  # sibling profiles.
  #
  # CourseDocumentTest re-enables MongoDB under the `mongo` profile, which is
  # the only place a real mongod is worth starting.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

  flyway:
    # RUN THE REAL MIGRATIONS.
    #
    # Not a schema Hibernate invented from the entity classes - the actual SQL
    # files the application ships, so the integration tests validate the
    # mappings against the schema that production will really have. That pairing
    # with `ddl-auto: validate` below is the whole point of this profile: a
    # mapping that has drifted from the migrations fails here rather than on
    # deployment.
    #
    # classpath:, not a relative filesystem: path. This used to read
    #
    #     filesystem:../src/main/resources/db/migration
    #
    # which was correct when the Spring service was a module in a subdirectory
    # and `..` meant the repository root. After the move to a single project at
    # the root, `..` pointed outside the repository, Flyway resolved no
    # migrations, and every table was missing - but only where the tests
    # actually run, since they need Docker and skip themselves without it. A
    # classpath location does not care where the module sits.
    enabled: true
    locations: classpath:db/migration

  datasource:
    hikari:
      # BIGGER THAN PRODUCTION, on purpose.
      #
      # concurrentEnrollmentsDoNotOversell fires 10 simultaneous requests, and
      # each one holds a connection for the whole transaction while it waits on
      # SELECT ... FOR UPDATE. At the production size of 10 that is exactly the
      # ceiling, and any request needing a second connection would wait for the
      # 20-second timeout and fail the test for a reason that has nothing to do
      # with the seat rule.
      #
      # Worth noticing what this demonstrates rather than just working around: a
      # pessimistic lock does not only serialise the ROWS, it pins a connection
      # for the duration. That is the real cost of the lock, and the reason
      # fieldbook chapter 25 says the pool is your concurrency limit.
      maximum-pool-size: 20

  jpa:
    hibernate:
      # VALIDATE, exactly as in production.
      #
      # Flyway builds the schema above; Hibernate then checks every mapping in
      # this module against it and refuses to start on any disagreement. So this
      # single line turns EnrollmentApiIT into the drift detector between the two
      # applications: add a column to an entity here without writing a migration,
      # and the context fails to load.
      #
      # It is also the setting the running application uses, which means the test
      # exercises the real startup path rather than a test-only shortcut.
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

    show-sql: false
    open-in-view: false

logging:
  level:
    root: WARN
    it.unicam.cs.enrollment.spring: INFO
    # Testcontainers is chatty about image pulls on a cold machine; leave this
    # at INFO the first time you run it so you can see what is being downloaded.
    org.testcontainers: WARN
    com.github.dockerjava: WARN
